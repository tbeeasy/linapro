server:
  address: ":9120"
  dumpRouterMap: false
  gracefulShutdownTimeout: 30
  extensions:
    apiDocPath: "/api.json"

logger:
  path: ""
  file: "{Y-m-d}.log"
  level: "all"
  stdout: true
  extensions:
    structured: false
    traceIDEnabled: false

database:
  default:
    link: "pgsql:postgres:postgres@tcp(127.0.0.1:5432)/linapro?sslmode=disable"
    timezone: "Asia/Shanghai"
    debug: false

jwt:
  secret: ""
  expire: 24h

session:
  timeout: 24h
  cleanupInterval: 5m

scheduler:
  defaultTimezone: "Asia/Shanghai"

workspace:
  basePath: "/admin"

i18n:
  default: zh-CN
  enabled: true
  locales:
    - locale: en-US
      nativeName: English
    - locale: zh-CN
      nativeName: 简体中文

cluster:
  enabled: false

upload:
  path: "temp/upload"
  maxSize: 200

# ── 共享凭据：只在这里登记一次，下面各插件段用 YAML 别名（*xxx）引用 ──
# 本段不是任何插件的配置，宿主不读取；须写在 plugin 之前（别名只能引用已出现的锚点）。
# 别名名写错会导致整个配置文件加载失败，启动即暴露。
_anchors:
  # 飞书身份应用（登录 / 通讯录同步；同时作为考勤机器人）。唯一登记处，
  # 引用方：employee-core.lark_apps、lark-push.push_groups、moka-report-sync、recruit-pipeline。
  lark_hegs_app_id: &lark_hegs_app_id "" # 霍尔果斯飞书
  lark_hegs_secret: &lark_hegs_secret ""
  lark_xj_app_id: &lark_xj_app_id "" # 广州星嘉飞书
  lark_xj_secret: &lark_xj_secret ""
  # 飞书 Bitable 读写所用应用（moka-report-sync / recruit-pipeline），用 <<: 合并进插件段。
  lark_bitable: &lark_bitable
    lark:
      appId: *lark_hegs_app_id
      appSecret: *lark_hegs_secret
  # Moka 凭据（moka-report-sync / recruit-pipeline / employee-core），用 <<: 合并进插件段。
  # 注意 <<: 是浅合并：插件段若再写 moka:，会整块替换而不是只覆盖其中某个字段。
  moka: &moka
    moka:
      apiKey: "" # Moka Basic Auth 用户名（等价 curl -u 'apiKey:'）
      operatorEmail: "" # 调 interview-information（视频面试链接）接口所需管理员邮箱；recruit-pipeline 需求2 使用
      entCode: "" # 租户唯一 ID，由 Moka CSM 提供
      apiCodes: # 每个接口一个独立的 apiCode，由 Moka CSM 分配；新增接口只加一行，无需改代码
        reportData: ""
        batchData: ""
      baseURL: "https://api.mokahr.com" # 可省略，用默认值
      rsaPrivateKey: | # RSA 私钥 PEM（PKCS#1 或 PKCS#8 均可）
        -----BEGIN PRIVATE KEY-----
          
        -----END PRIVATE KEY-----

plugin:
  allowForceUninstall: false
  dynamic:
    storagePath: "temp/output"
  # DB already initialised manually; withMockData: false to skip duplicate inserts.
  # tenant-core must come before attend-poc so services.Tenant() is non-nil when
  # attend-poc registers its routes.
  autoEnable:
    - id: "linapro-tenant-core"
    - id: "linapro-org-core"
    - id: "linapro-monitor-loginlog"
    - id: "linapro-monitor-operlog"
    # - id: "linapro-attend-poc" # 考勤系统
    - id: "linapro-employee-core" # 员工系统核心
    - id: "linapro-lark-push" # 飞书消息推送能力（须排在 linapro-employee-core 之后：数组顺序即启用顺序）
    - id: "linapro-eval-360" # 360 度绩效测评
    # - id: "linapro-moka-report-sync" # Moka 报表数据定时同步到飞书 Bitable
    # - id: "linapro-recruit-pipeline" # Moka 招聘相关表同步到飞书 Bitable

  linapro-moka-report-sync: # 报表同步插件专属：飞书凭据与同步参数
    # 报表映射（reportMappings）不在这里，走后台 sys_config：
    #   键：plugin.linapro-moka-report-sync.reportMappings
    #   值（JSON 数组）：[{"reportId":123456,"appToken":"xxx","tableId":"tblXXX",
    #                      "uniqueField":"姓名","remark":"员工分布表","enable":true}]
    # 修改凭证需重启宿主；reportMappings 改动热生效、无需重启。
    <<: [*moka, *lark_bitable]
    tenantId: 0 # 读取 sys_config 报表映射所用租户，须与建映射的租户一致
    intervalMinutes: 59 # 同步间隔（分钟），改此值需重启
  linapro-recruit-pipeline: # 招聘流水线业务层：复用飞书 appId/appSecret 调 Bitable
    <<: [*moka, *lark_bitable]
    redis:
      address: "127.0.0.1:6379" # 必填；为空则插件跳过 AI 待判定入队（优雅降级）
      pass: "" # 可选，默认空（无 AUTH）
      db: 0 # 可选，默认 0；逻辑库隔离用
      ttl_hours: 72 # 可选，默认 72；pending 键安全网 TTL
    # 定时任务间隔（分钟）
    candidate_poll_interval_minutes: 59 # 候选人轮询默认间隔 5 分钟
    interview_sync_interval_minutes: 59 # 面试同步定时任务默认轮询间隔（分钟）
    report_sync_interval_minutes: 59 # 人才画像评分报表同步定时任务默认轮询间隔（分钟）
  linapro-lark-push: # 飞书消息推送：按调用方分组的推送应用凭据
    # 分组名 = 调用方插件 ID，各分组用各自的机器人。identity_app_id 一律引用 _anchors 里的身份应用。
    # 预警 / 通知类分组须用独立推送应用，不得走考勤机器人；考勤分组则直接用身份应用本身发。
    push_groups:
      linapro-eval-360:
        - app_id: &eval360_hegs_app_id "" # 霍尔果斯测评推送应用（card_templates 引用）
          secret_key: ""
          name: "360测评助手(霍尔果斯)"
          identity_app_id: *lark_hegs_app_id
        - app_id: &eval360_xj_app_id "" # 星嘉测评推送应用（card_templates 引用）
          secret_key: ""
          name: "360测评助手(星嘉)"
          identity_app_id: *lark_xj_app_id
      # linapro-attend-poc: # 考勤消息：用两个企业的身份应用本身（考勤机器人）发送，前提是应用已开启机器人能力
      #   - app_id: *lark_hegs_app_id
      #     secret_key: *lark_hegs_secret
      #     name: "考勤(霍尔果斯)"
      #     identity_app_id: *lark_hegs_app_id
      #   - app_id: *lark_xj_app_id
      #     secret_key: *lark_xj_secret
      #     name: "考勤(星嘉)"
      #     identity_app_id: *lark_xj_app_id
      inner_notify: # 内网消息通知
        - app_id: ""
          secret_key: ""
          name: "内网消息通知"
          identity_app_id: *lark_xj_app_id
      outer_notify: # 外网消息通知
        - app_id: ""
          secret_key: ""
          name: "外网消息通知"
          identity_app_id: *lark_hegs_app_id
    # 对外 HTTP 接口（/open/v1）的 HMAC 签名凭据不在本文件配置：在后台「系统设置 → 飞书推送凭据」
    # 维护（app_key / secret / 绑定分组 / 启停），每次请求查库，修改即时生效。
    alert: # 部署与数据缺陷告警（可选）。留空则只写日志、不推群
      app_id: "" # 告警专用飞书应用，不参与业务推送
      secret_key: ""
      chat_id: "" # 告警群；应用须已被拉进该群且开了机器人能力
      interval: "30m" # 同一告警的防抖窗口，缺省 30m
  linapro-employee-core: # 员工核心：飞书多企业 App 凭证（登录换 open_id + 通讯录同步用）
    emp_jwt_secret: ""
    sync_interval_minutes: 59 # 同步周期，表达式为 0 %d * * * *（可选，默认0分钟0秒开始执行，1表示1分0秒开始执行；改值需重启）
    lark_apps: # 凭据登记在 _anchors，这里只引用
      - app_id: *lark_hegs_app_id # 霍尔果斯飞书
        secret_key: *lark_hegs_secret
        assoc: true
      - app_id: *lark_xj_app_id # 广州星嘉飞书
        secret_key: *lark_xj_secret
        assoc: false
    # Moka HCM 凭证：全量同步 job 拉全量员工用。缺任一必填项，同步会以
    # "incomplete Moka HCM credentials" 报错并跳过（不会拉到员工）。
    <<: [*moka]
  linapro-eval-360:
    todo_h5_url: "https://xj-aass.luckystar001.top/admin/#/eval-360/emp/todo" # 生产是 hash 路由
    # 卡片模板按推送应用分别配置（模板归属具体应用、跨企业不可复用，无全局兜底）。
    # app_id 引用上面 push_groups.linapro-eval-360 的推送应用；template_version 留空=模板当前发布版本。
    card_templates:
      - app_id: *eval360_hegs_app_id # 霍尔果斯测评推送应用
        template_id: ""
      - app_id: *eval360_xj_app_id # 星嘉测评推送应用
        template_id: "" # TODO 待替换为广州星嘉应用下的模板 ID
